version: 2

models:
  - name: monitoring_daily_alerts
    description: alerts, hits and misses per transaction day
    columns:
      - name: transaction_date
        data_tests:
          - unique
          - not_null

  - name: monitoring_score_drift
    description: daily score distribution and psi against the first 7 live days
    columns:
      - name: transaction_date
        data_tests:
          - unique
          - not_null
      - name: drift_level
        data_tests:
          - accepted_values:
              arguments:
                values: ["stable", "moderate", "significant"]

  - name: monitoring_model_vs_actual
    description: precision, recall and score separation per model version and merchant category
    columns:
      - name: model_version
        data_tests:
          - not_null
      - name: merchant_category
        data_tests:
          - not_null