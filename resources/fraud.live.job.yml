# live lakehouse job: run after the lakehouse sink has landed files. bronze picks up only new files (Auto Loader),
# then live silver and live scores are rebuilt with the same sql as history, then data quality checks run
# and fail the job on any error-severity check, then dbt rebuilds and tests the monitoring marts.
resources:
  jobs:
    fraud_live_lakehouse:
      name: fraud_live_lakehouse
      tasks:
        - task_key: bronze_live
          notebook_task:
            notebook_path: ../notebooks/06_bronze_live.py
        - task_key: silver_live
          depends_on:
            - task_key: bronze_live
          notebook_task:
            notebook_path: ../notebooks/07_silver_live.py
        - task_key: data_quality
          depends_on:
            - task_key: silver_live
          notebook_task:
            notebook_path: ../notebooks/08_data_quality.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: dbt_monitoring
          depends_on:
            - task_key: data_quality
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt
            commands:
              - dbt build
            warehouse_id: 606b0c60dc21c8fd
            catalog: fraud
            schema: gold
      environments:
        - environment_key: dbt
          spec:
            client: "2"
            dependencies:
              - dbt-databricks==1.10.19