# live lakehouse job: run after the lakehouse sink has landed files. bronze picks up only new files (Auto Loader),
# then live silver and live scores are rebuilt with the same sql as history.
resources:
  jobs:
    fraud_live_lakehouse:
      name: fraud_live_lakehouse
      tasks:
        - task_key: bronze_live
          notebook_task:
            notebook_path: ../notebooks/06_bronze_live.py
        - task_key: silver_live
          depends_on:
            - task_key: bronze_live
          notebook_task:
            notebook_path: ../notebooks/07_silver_live.py