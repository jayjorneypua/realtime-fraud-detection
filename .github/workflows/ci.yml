# CI/CD: validate the bundle, lint the python and parse the dbt project on every PR, deploy the bundle on merge
# to main. the databricks cli is pinned so CI and the laptop always use the same version.
# api, database and web jobs are added as those parts are built.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_CLI_VERSION: "1.28.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}

      - name: validate bundle
        run: databricks bundle validate -t prod

  python_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install dev requirements
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check streaming

  dbt_parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install dbt
        run: pip install -r requirements-dbt.txt

      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt

  deploy:
    needs: [validate, python_lint, dbt_parse]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}

      - name: deploy bundle
        run: databricks bundle deploy -t prod